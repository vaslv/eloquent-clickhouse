name: Compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Laravel 12 supports PHP >= 8.2, Laravel 13 requires PHP >= 8.3.
        include:
          - laravel: "12"
            php: "8.2"
            composer_flags: "--prefer-lowest"
          - laravel: "12"
            php: "8.3"
            composer_flags: ""
          - laravel: "12"
            php: "8.4"
            composer_flags: ""
          - laravel: "13"
            php: "8.3"
            composer_flags: ""
          - laravel: "13"
            php: "8.4"
            composer_flags: ""

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        env:
          CLICKHOUSE_DB: eloquent_test
          CLICKHOUSE_USER: eloquent
          CLICKHOUSE_PASSWORD: secret
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping || exit 1"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 30

    env:
      CLICKHOUSE_HOST: 127.0.0.1
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: eloquent_test
      CLICKHOUSE_USERNAME: eloquent
      CLICKHOUSE_PASSWORD: secret

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Pin Illuminate major version
        run: composer require "illuminate/database:^${{ matrix.laravel }}.0" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist ${{ matrix.composer_flags }}

      - name: Verify Illuminate major version
        # Single shell quotes: with double quotes the shell expands $version to an
        # empty string before PHP ever sees the code, producing a parse error.
        run: |
          php -r 'require "vendor/autoload.php"; $version = \Composer\InstalledVersions::getPrettyVersion("illuminate/database"); if (!preg_match("/^v?${{ matrix.laravel }}\./", $version)) { fwrite(STDERR, "Unexpected illuminate/database version: $version".PHP_EOL); exit(1); } echo $version, PHP_EOL;'

      - name: Run unit and integration tests
        run: composer test:all

  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      # Static analysis is pinned to one PHP + the highest deps on purpose: PHPStan's
      # verdicts (and which ignore patterns match) depend on the installed library
      # versions, so running it across the test matrix would produce spurious failures.
      - name: Static analysis (PHPStan)
        run: composer analyse
